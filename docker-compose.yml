services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agentsys_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE: ""
    container_name: agentsys_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
