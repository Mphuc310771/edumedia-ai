AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AgentSys — S3, SQS, Lambda, Rekognition, Transcribe, DynamoDB, Bedrock, CloudWatch

Parameters:
  ApiKey:
    Type: String
    NoEcho: true
    Description: Value of the X-API-Key header required by the HTTP API
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Bedrock model ID. Default Nova Lite for lab cost. Claude 3.5 Sonnet also works if enabled.
  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: Region where the Bedrock model is enabled

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Timeout: 60
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        MEDIA_BUCKET: !Ref MediaBucket
        METADATA_TABLE: !Ref MetadataTable
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_REGION: !Ref BedrockRegion
        ENVIRONMENT: production
        ADMIN_API_KEY: !Ref ApiKey
        CLOUDWATCH_NAMESPACE: AgentSys
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - http://localhost:3000
        - http://127.0.0.1:3000
        - http://localhost:5174
        - http://127.0.0.1:5174
      AllowHeaders:
        - Content-Type
        - X-API-Key
        - Authorization
      AllowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      MaxAge: 3000

Resources:
  IngestDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: agentsys-ingest-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  IngestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: agentsys-ingest-queue
      VisibilityTimeout: 180
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestDLQ.Arn
        maxReceiveCount: 3

  IngestQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref IngestQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3ToSendIngestMessages
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt IngestQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  MediaBucket:
    Type: AWS::S3::Bucket
    DependsOn: IngestQueuePolicy
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins:
              - http://localhost:3000
              - http://127.0.0.1:3000
              - http://localhost:5174
              - http://127.0.0.1:5174
            ExposedHeaders: [ETag]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTempTranscripts
            Status: Enabled
            Prefix: transcripts/
            ExpirationInDays: 7
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt IngestQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowTranscribeReadUploads
            Effect: Allow
            Principal:
              Service: transcribe.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub ${MediaBucket.Arn}/uploads/*
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowTranscribeWriteOutput
            Effect: Allow
            Principal:
              Service: transcribe.amazonaws.com
            Action:
              - s3:PutObject
            Resource: !Sub ${MediaBucket.Arn}/transcripts/*
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowTranscribeBucketLocation
            Effect: Allow
            Principal:
              Service: transcribe.amazonaws.com
            Action:
              - s3:GetBucketLocation
            Resource: !GetAtt MediaBucket.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  MetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AgentSysMediaMetadata
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: file_id
          AttributeType: S
        - AttributeName: category
          AttributeType: S
      KeySchema:
        - AttributeName: file_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: category-index
          KeySchema:
            - AttributeName: category
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: agentsys-ingest
      Handler: apps.lambda_handlers.ingest.handler
      CodeUri: ../pack
      Timeout: 120
      # ReservedConcurrentExecutions omitted: new-account Lambda quota
      # (UnreservedConcurrentExecution minimum 10) rejects reserved=2.
      Policies:
        - Statement:
            - Sid: ReadMediaObjects
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub ${MediaBucket.Arn}/uploads/*
                - !Sub ${MediaBucket.Arn}/transcripts/*
                - !Sub ${MediaBucket.Arn}/thumbs/*
            - Sid: RekognitionRead
              Effect: Allow
              Action:
                - rekognition:DetectLabels
                - rekognition:DetectText
              Resource: "*"
            - Sid: TranscribeJobs
              Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
                - transcribe:GetTranscriptionJob
              Resource: "*"
            - Sid: DynamoWrite
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Scan
                - dynamodb:Query
              Resource:
                - !GetAtt MetadataTable.Arn
                - !Sub ${MetadataTable.Arn}/index/category-index
            - Sid: CustomMetrics
              Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: AgentSys
      Events:
        FromQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt IngestQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
        TranscribeStateChange:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.transcribe
              detail-type:
                - Transcribe Job State Change
              detail:
                TranscriptionJobStatus:
                  - COMPLETED
                  - FAILED

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: agentsys-api
      Handler: apps.lambda_handlers.api.handler
      CodeUri: ../pack
      Timeout: 30
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
      Policies:
        - Statement:
            - Sid: PresignUploads
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub ${MediaBucket.Arn}/*
            - Sid: DynamoAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:BatchWriteItem
              Resource:
                - !GetAtt MetadataTable.Arn
                - !Sub ${MetadataTable.Arn}/index/category-index
            - Sid: HealthPings
              Effect: Allow
              Action:
                - sts:GetCallerIdentity
                - rekognition:ListCollections
                - transcribe:ListTranscriptionJobs
                - bedrock:GetFoundationModel
              Resource: "*"
            - Sid: HealthBucket
              Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !GetAtt MediaBucket.Arn
            - Sid: HealthTable
              Effect: Allow
              Action:
                - dynamodb:DescribeTable
              Resource: !GetAtt MetadataTable.Arn
            - Sid: BedrockInvoke
              Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub arn:aws:bedrock:${BedrockRegion}::foundation-model/*
                - !Sub arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:inference-profile/*
            - Sid: CustomMetrics
              Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: AgentSys

  IngestErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: agentsys-ingest-errors
      AlarmDescription: Fires when the AgentSys ingest Lambda reports errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: agentsys-api-errors
      AlarmDescription: Fires when the AgentSys API Lambda reports errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  IngestFailedMetricAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: agentsys-ingest-failed
      AlarmDescription: Custom AgentSys metric when an ingest job marks FAILED.
      Namespace: AgentSys
      MetricName: MediaIngestFailed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  IngestDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: agentsys-ingest-dlq
      AlarmDescription: Messages landed on the ingest dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IngestDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${IngestFunction}
      RetentionInDays: 14

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 14

Outputs:
  ApiEndpoint:
    Description: HTTP API base URL
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  MediaBucketName:
    Description: S3 bucket for media uploads
    Value: !Ref MediaBucket
  MetadataTableName:
    Description: DynamoDB table for media metadata
    Value: !Ref MetadataTable
  IngestQueueUrl:
    Description: SQS buffer between S3 ObjectCreated and ingest Lambda
    Value: !Ref IngestQueue
  IngestDlqUrl:
    Description: Dead-letter queue for failed ingest messages
    Value: !Ref IngestDLQ
  IngestFunctionName:
    Value: !Ref IngestFunction
  ApiFunctionName:
    Value: !Ref ApiFunction
  IngestErrorAlarmName:
    Value: !Ref IngestErrorAlarm
  IngestDlqAlarmName:
    Value: !Ref IngestDlqAlarm
