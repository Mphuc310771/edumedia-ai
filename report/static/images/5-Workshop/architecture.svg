<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 500" width="1140" height="500">
  <defs>
    <!-- Markers -->
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#232F3E" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8C4FFF" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB" />
    </marker>

    <!-- Drop Shadow for AWS Icons -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.10" />
    </filter>
  </defs>

  <style>
    .aws-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .main-title { font-size: 17px; font-weight: 800; fill: #111827; letter-spacing: -0.3px; }
    .svc-title { font-size: 12px; font-weight: 700; fill: #1E293B; }
    .svc-desc { font-size: 10px; fill: #64748B; }
    .edge-lbl { font-size: 9.5px; font-weight: 600; fill: #475569; }
    .edge-lbl-bg { fill: #FFFFFF; rx: 4px; }
  </style>

  <!-- Pure White Crisp Background -->
  <rect width="1140" height="500" fill="#FFFFFF" />

  <!-- Diagram Main Title -->
  <text x="570" y="36" text-anchor="middle" class="aws-text main-title">AgentSys — Serverless Multimodal AI Media Retrieval Architecture</text>

  <!-- ==================== AWS REGION BOUNDARY ==================== -->
  <rect x="180" y="55" width="935" height="425" rx="8" fill="none" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="6,4" />
  <rect x="195" y="46" width="130" height="18" rx="3" fill="#0073BB" />
  <text x="260" y="58" text-anchor="middle" class="aws-text" font-size="10" font-weight="700" fill="#FFFFFF">Region: us-east-1</text>

  <!-- ==================== ICONS & SERVICES ==================== -->

  <!-- 1. USER CLIENT (x=45, y=205) -->
  <g transform="translate(45, 205)" class="aws-text">
    <rect width="56" height="56" rx="10" fill="#0284C7" filter="url(#shadow)" />
    <circle cx="28" cy="21" r="8" fill="#FFFFFF" />
    <path d="M14 42 C14 34 20 32 28 32 C36 32 42 34 42 42 Z" fill="#FFFFFF" />
    <text x="28" y="75" text-anchor="middle" class="svc-title">User Client</text>
    <text x="28" y="89" text-anchor="middle" class="svc-desc">React 18 + Vite</text>
  </g>

  <!-- 2. AMAZON S3 (x=225, y=105) -->
  <g transform="translate(225, 105)" class="aws-text">
    <rect width="56" height="56" rx="10" fill="#15803D" filter="url(#shadow)" />
    <ellipse cx="28" cy="20" rx="16" ry="6" fill="none" stroke="#FFFFFF" stroke-width="2.2" />
    <path d="M12 20 V38 C12 42 44 42 44 38 V20 M12 29 C12 33 44 33 44 29" fill="none" stroke="#FFFFFF" stroke-width="2.2" />
    <text x="28" y="75" text-anchor="middle" class="svc-title">Amazon S3</text>
    <text x="28" y="89" text-anchor="middle" class="svc-desc">Media Bucket</text>
  </g>

  <!-- 3. AMAZON SQS (x=365, y=105) -->
  <g transform="translate(365, 105)" class="aws-text">
    <rect width="56" height="56" rx="10" fill="#BE185D" filter="url(#shadow)" />
    <rect x="14" y="18" width="28" height="20" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2.2" />
    <line x1="18" y1="26" x2="38" y2="26" stroke="#FFFFFF" stroke-width="2" />
    <line x1="18" y1="32" x2="32" y2="32" stroke="#FFFFFF" stroke-width="2" />
    <text x="28" y="75" text-anchor="middle" class="svc-title">Amazon SQS</text>
    <text x="28" y="89" text-anchor="middle" class="svc-desc">Ingest Queue</text>
  </g>

  <!-- 4. INGEST DLQ (x=365, y=225) -->
  <g transform="translate(365, 225)" class="aws-text">
    <rect width="56" height="56" rx="10" fill="#DC2626" filter="url(#shadow)" />
    <rect x="14" y="18" width="28" height="20" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2.2" />
    <line x1="18" y1="26" x2="38" y2="26" stroke="#FFFFFF" stroke-width="2" />
    <line x1="18" y1="32" x2="30" y2="32" stroke="#FFFFFF" stroke-width="2" />
    <text x="28" y="75" text-anchor="middle" class="svc-title" fill="#DC2626">Ingest DLQ</text>
    <text x="28" y="89" text-anchor="middle" class="svc-desc" fill="#DC2626">maxReceive: 3</text>
  </g>

  <!-- 5. LAMBDA INGEST (x=505, y=105) -->
  <g transform="translate(505, 105)" class="aws-text">
    <rect width="56" height="56" rx="10" fill="#EA580C" filter="url(#shadow)" />
    <path d="M18 45 L24 45 L31 24 L37 38 L33 45 L41 45 L39 40 L34 29 L39 15 L32 15 L28 27 L22 15 L16 15 L25 36 Z" fill="#FFFFFF" />
    <text x="28" y="75" text-anchor="middle" class="svc-title">AWS Lambda</text>
    <text x="28" y="89" text-anchor="middle" class="svc-desc">agentsys-ingest</text>
  </g>

  <!-- 6. AMAZON REKOGNITION (x=665, y=90) -->
  <g transform="translate(665, 90)" class="aws-text">
    <rect width="56" height="56" rx="10" fill="#0D9488" filter="url(#shadow)" />
    <path d="M15 28 C20 19 36 19 41 28 C36 37 20 37 15 28 Z" fill="none" stroke="#FFFFFF" stroke-width="2.4" />
    <circle cx="28" cy="28" r="5" fill="#FFFFFF" />
    <text x="28" y="75" text-anchor="middle" class="svc-title">Rekognition</text>
    <text x="28" y="89" text-anchor="middle" class="svc-desc">Vision OCR &amp; Labels</text>
  </g>

  <!-- 7. AMAZON TRANSCRIBE (x=665, y=215) -->
  <g transform="translate(665, 215)" class="aws-text">
    <rect width="56" height="56" rx="10" fill="#0D9488" filter="url(#shadow)" />
    <path d="M15 28 L20 20 L25 36 L31 16 L36 34 L41 28" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    <text x="28" y="75" text-anchor="middle" class="svc-title">Transcribe</text>
    <text x="28" y="89" text-anchor="middle" class="svc-desc">Speech ASR (vi-VN)</text>
  </g>

  <!-- 8. AMAZON DYNAMODB (x=835, y=150) -->
  <g transform="translate(835, 150)" class="aws-text">
    <rect width="56" height="56" rx="10" fill="#2563EB" filter="url(#shadow)" />
    <ellipse cx="28" cy="19" rx="16" ry="6" fill="none" stroke="#FFFFFF" stroke-width="2.2" />
    <path d="M12 19 V39 C12 43 44 43 44 39 V19 M12 29 C12 33 44 33 44 29" fill="none" stroke="#FFFFFF" stroke-width="2.2" />
    <text x="28" y="75" text-anchor="middle" class="svc-title">DynamoDB</text>
    <text x="28" y="89" text-anchor="middle" class="svc-desc">Single-Table (256-d)</text>
  </g>

  <!-- 9. API GATEWAY (x=225, y=340) -->
  <g transform="translate(225, 340)" class="aws-text">
    <rect width="56" height="56" rx="10" fill="#BE185D" filter="url(#shadow)" />
    <path d="M28 14 L41 22 L41 37 L28 45 L15 37 L15 22 Z" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" />
    <circle cx="28" cy="29" r="4" fill="#FFFFFF" />
    <text x="28" y="75" text-anchor="middle" class="svc-title">API Gateway</text>
    <text x="28" y="89" text-anchor="middle" class="svc-desc">HTTP Proxy</text>
  </g>

  <!-- 10. LAMBDA API (x=505, y=340) -->
  <g transform="translate(505, 340)" class="aws-text">
    <rect width="56" height="56" rx="10" fill="#EA580C" filter="url(#shadow)" />
    <path d="M18 45 L24 45 L31 24 L37 38 L33 45 L41 45 L39 40 L34 29 L39 15 L32 15 L28 27 L22 15 L16 15 L25 36 Z" fill="#FFFFFF" />
    <text x="28" y="75" text-anchor="middle" class="svc-title">AWS Lambda</text>
    <text x="28" y="89" text-anchor="middle" class="svc-desc">agentsys-api</text>
  </g>

  <!-- 11. AMAZON BEDROCK (x=835, y=340) -->
  <g transform="translate(835, 340)" class="aws-text">
    <rect width="56" height="56" rx="10" fill="#8C4FFF" filter="url(#shadow)" />
    <path d="M28 15 L32 24 L41 27 L33 31 L30 41 L26 31 L17 27 L26 24 Z" fill="#FFFFFF" />
    <text x="28" y="75" text-anchor="middle" class="svc-title">Amazon Bedrock</text>
    <text x="28" y="89" text-anchor="middle" class="svc-desc">Nova Lite + Titan V2</text>
  </g>

  <!-- 12. CLOUDWATCH (x=1000, y=245) -->
  <g transform="translate(1000, 245)" class="aws-text">
    <rect width="56" height="56" rx="10" fill="#DB2777" filter="url(#shadow)" />
    <path d="M15 36 A15 15 0 0 1 41 36" fill="none" stroke="#FFFFFF" stroke-width="2.4" />
    <line x1="28" y1="36" x2="35" y2="22" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" />
    <text x="28" y="75" text-anchor="middle" class="svc-title">CloudWatch</text>
    <text x="28" y="89" text-anchor="middle" class="svc-desc">Logs &amp; 4 Alarms</text>
  </g>


  <!-- ==================== ELEGANT CONNECTORS ==================== -->

  <!-- User -> S3 Direct Upload -->
  <path d="M 73 205 L 73 133 L 225 133" fill="none" stroke="#15803D" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr)" />
  <rect x="95" y="123" width="105" height="18" class="edge-lbl-bg" stroke="#15803D" stroke-width="0.8" />
  <text x="147" y="136" text-anchor="middle" class="edge-lbl" fill="#15803D">Presigned PUT</text>

  <!-- User -> API Gateway Search Query -->
  <path d="M 73 261 L 73 368 L 225 368" fill="none" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arr)" />
  <rect x="100" y="358" width="95" height="18" class="edge-lbl-bg" stroke="#CBD5E1" stroke-width="0.8" />
  <text x="147" y="371" text-anchor="middle" class="edge-lbl">Search Query</text>

  <!-- S3 -> SQS -->
  <path d="M 281 133 L 365 133" fill="none" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arr)" />
  <rect x="290" y="123" width="65" height="18" class="edge-lbl-bg" stroke="#CBD5E1" stroke-width="0.8" />
  <text x="322" y="136" text-anchor="middle" class="edge-lbl">s3:Created</text>

  <!-- SQS -> DLQ (Failure) -->
  <path d="M 393 161 L 393 225" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-red)" />

  <!-- SQS -> Lambda Ingest -->
  <path d="M 421 133 L 505 133" fill="none" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arr)" />
  <rect x="430" y="123" width="65" height="18" class="edge-lbl-bg" stroke="#CBD5E1" stroke-width="0.8" />
  <text x="462" y="136" text-anchor="middle" class="edge-lbl">Batch: 5</text>

  <!-- Lambda Ingest -> Rekognition -->
  <path d="M 561 125 L 665 110" fill="none" stroke="#0D9488" stroke-width="1.8" marker-end="url(#arr)" />

  <!-- Lambda Ingest -> Transcribe -->
  <path d="M 561 141 L 665 235" fill="none" stroke="#0D9488" stroke-width="1.8" marker-end="url(#arr)" />

  <!-- Rekognition -> DynamoDB -->
  <path d="M 721 118 L 835 168" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arr-blue)" />

  <!-- Transcribe -> DynamoDB -->
  <path d="M 721 243 L 835 188" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arr-blue)" />
  <rect x="745" y="148" width="65" height="18" class="edge-lbl-bg" stroke="#2563EB" stroke-width="0.8" />
  <text x="777" y="161" text-anchor="middle" class="edge-lbl" fill="#2563EB">PutItem</text>

  <!-- API Gateway -> Lambda API -->
  <path d="M 281 368 L 505 368" fill="none" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arr)" />

  <!-- Lambda API -> Bedrock (Query Planning & Titan) -->
  <path d="M 561 368 L 835 368" fill="none" stroke="#8C4FFF" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-purple)" />
  <rect x="645" y="358" width="120" height="18" class="edge-lbl-bg" stroke="#8C4FFF" stroke-width="0.8" />
  <text x="705" y="371" text-anchor="middle" class="edge-lbl" fill="#8C4FFF">Query Plan &amp; Vector</text>

  <!-- Lambda API -> DynamoDB (Hybrid GSI Search via clean corridor at y=295) -->
  <path d="M 533 340 L 533 295 L 863 295 L 863 206" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arr-blue)" />
  <rect x="745" y="285" width="75" height="18" class="edge-lbl-bg" stroke="#2563EB" stroke-width="0.8" />
  <text x="782" y="298" text-anchor="middle" class="edge-lbl" fill="#2563EB">GSI Search</text>

  <!-- DynamoDB / Lambda -> CloudWatch -->
  <path d="M 891 178 L 1000 260" fill="none" stroke="#DB2777" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" />
  <path d="M 891 368 L 1000 285" fill="none" stroke="#DB2777" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" />

</svg>
