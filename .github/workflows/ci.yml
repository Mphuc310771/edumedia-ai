name: AgentSys CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Pytest
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      MEDIA_PROVIDER: memory
      SEED_DEMO_ITEMS: "true"
      ADMIN_API_KEY: test-key
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall apps/ config/ tests/
      - run: python -m pytest tests/ -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gallery_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gallery_web/package-lock.json
      - run: npm ci || npm install
      - run: npm run build
