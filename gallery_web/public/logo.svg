<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="prismA" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="prismB" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="prismCore" cx="32" cy="32" r="10" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <filter id="prismGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Shield Background -->
  <rect width="64" height="64" rx="18" fill="#0A0B14"/>
  <rect width="64" height="64" rx="18" stroke="url(#prismA)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Outer Isometric Facets -->
  <path d="M32 10L52 21.5V44.5L32 56L12 44.5V21.5L32 10Z" stroke="url(#prismA)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Multimodal Neural Triad -->
  <path d="M32 10V33L52 44.5" stroke="url(#prismB)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 33L12 44.5" stroke="url(#prismB)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 33L12 21.5" stroke="url(#prismA)" stroke-width="1.5" stroke-dasharray="3 4" stroke-opacity="0.7"/>
  <path d="M32 33L52 21.5" stroke="url(#prismA)" stroke-width="1.5" stroke-dasharray="3 4" stroke-opacity="0.7"/>

  <!-- Multimodal Nodes -->
  <circle cx="32" cy="10" r="3" fill="#38BDF8"/>
  <circle cx="52" cy="21.5" r="3" fill="#818CF8"/>
  <circle cx="52" cy="44.5" r="3" fill="#A855F7"/>
  <circle cx="32" cy="56" r="3" fill="#06B6D4"/>
  <circle cx="12" cy="44.5" r="3" fill="#818CF8"/>
  <circle cx="12" cy="21.5" r="3" fill="#38BDF8"/>

  <!-- Radiant AI Agent Core -->
  <circle cx="32" cy="33" r="7" fill="url(#prismCore)" filter="url(#prismGlow)"/>
  <circle cx="32" cy="33" r="2.5" fill="#FFFFFF"/>
</svg>
